name: CI

# Runs on pull requests, by hand, and from release.yml. Pushes alone run nothing.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:  # release.yml pre-publish gate

permissions:
  contents: read

# A new push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job has a timeout (GitHub's default is 360 min); a normal run takes ~1.5 min.
# Longest release.yml chain: guard 1 + lint 3 + test 5 + build 2 + github-release 2 = 13 min.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --locked --python 3.13

      # Hook environments are cloned on first use; cache them per config file.
      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # ruff check, ruff format, and whitespace checks (.pre-commit-config.yaml).
      - name: Pre-commit (all files)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # Strict mypy covers only strict-clean code (issue #11). Remaining errors per file:
      #   src/kavier/sdk/training/calibration/engine.py   53
      #   src/kavier/sdk/io/input_spec.py                 21
      #   src/kavier/sdk/io/stream_writer.py               5
      #   + ~12 smaller files in kavier/sdk/inference, kavier/sdk/energy, kavier/sdk/library
      # Add a file or package to a gate below once it is strict-clean.
      - name: Mypy (strict, clean packages)
        run: |
          uv run mypy --strict --show-error-codes \
            -p kavier.cli -p kavier.sdk.co2 -p kavier.sdk.cluster
      - name: Mypy (strict, top level and training engine)
        run: |
          uv run mypy --strict --follow-imports=skip --show-error-codes \
            src/kavier/__init__.py \
            src/kavier/__main__.py \
            src/kavier/sdk/training/calibration/__init__.py \
            src/kavier/sdk/training/core/engine.py

  test:
    needs: lint
    # Linux only; macOS is the development platform.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync (dev group; +calibration +plot on 3.13)
        run: |
          # The 3.13 leg adds the [calibration] and [plot] extras, so test_engine_regen.py and
          # test_plot.py run there instead of being skipped.
          if [ "${{ matrix.python-version }}" = "3.13" ]; then
            uv sync --locked --python 3.13 --extra calibration --extra plot
          else
            uv sync --locked --python "${{ matrix.python-version }}"
          fi

      - name: CLI smoke (entry points resolve)
        run: |
          uv run kavier --help
          uv run kavier inference --help
          uv run kavier training --help
          uv run kavier cluster --help
          uv run kavier energy --help
          uv run kavier carbon --help
          uv run python -m kavier --help
          uv run python -m kavier.cli --help

      - name: Run pytest (with coverage)
        run: uv run pytest --cov

  # Install the built wheel into a fresh venv and smoke every console script and packaged data (issue #12).
  wheel-smoke:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist + wheel
        run: uv build

      - name: Install wheel into a fresh venv and smoke it
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv" --python 3.13
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          # Run from an empty dir so nothing can be imported from the repo checkout.
          mkdir -p "$RUNNER_TEMP/wheel-smoke"
          cd "$RUNNER_TEMP/wheel-smoke"
          export PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH"
          kavier --help
          kavier inference --help
          kavier training --help
          kavier cluster --help
          kavier energy --help
          kavier carbon --help
          python -m kavier --help
          python -m kavier.cli --help
          # The calibration tables ship in the wheel.
          python -c "from kavier.sdk.training import calibration; assert calibration.available_calibrations()"

  # Build the Dockerfile so a broken image fails the pull request.
  docker-build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: kavier

  # The same strict build as docs-deploy.yml, so broken docs fail the pull request.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build docs (strict)
        run: |
          uv sync --locked --only-group docs --no-install-project
          uv run --no-sync mkdocs build --strict
