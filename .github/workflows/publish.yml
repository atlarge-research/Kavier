name: Publish to PyPI

# Trusted Publishing (OIDC): no API token. Configure a Trusted Publisher on PyPI
# for owner=atlarge-research, repo=Kavier, workflow=publish.yml. Publishing then
# happens automatically when a version tag (vX.Y.Z) is pushed.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # mint the OIDC token PyPI trusts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
