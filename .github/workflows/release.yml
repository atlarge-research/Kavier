name: Release

# One tag-triggered pipeline. Push an annotated version tag that matches pyproject's version
# (`uv version --bump minor`  ->  commit  ->  `git tag vX.Y.Z`  ->  `git push --tags`) and this:
#   guard (tag == pyproject)  ->  gates (reuse ci.yml)  ->  build the wheel once
#     ->  PyPI (OIDC, no token) + Docker (cli & ui -> GHCR) in parallel  ->  GitHub release.
# Nothing publishes unless the gates pass; the version lives ONLY in pyproject.toml (the tag mirrors it).
# Plain semver tags ONLY. GitHub filter patterns are full-ref matches, `[0-9]` is a character
# class and `+` means "one or more of the preceding element" (filter pattern cheat sheet), so
# `v0.5.1` starts a release while suffixed freeze/marker tags (`v0.5.1-thesis`, `v0.5.1rc1`) and
# four-component tags (`v0.5.0.2`) leave the trailing characters unmatched and never trigger it.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Least privilege, granted per-job below; declared here so the whole run can mint what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Fail fast if the tag and the source of truth disagree, so a mislabelled artifact can never ship.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Tag must equal pyproject.toml version
        run: |
          VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "pyproject=$VERSION  tag=$TAG"
          [ "$VERSION" = "$TAG" ] || { echo "::error::tag v$TAG does not match pyproject version $VERSION"; exit 1; }

  # Reuse the full CI suite (lint + mypy + test matrix + wheel-smoke) as the pre-publish gate — so
  # "tested" and "released" can never drift apart.
  gates:
    needs: guard
    # A called workflow can never hold more than the caller grants it, and ci.yml's test job asks
    # for `id-token: write` (tokenless Codecov upload). Raise the ceiling here or the gate errors.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml

  # Build the sdist + wheel ONCE; PyPI and the GitHub release both consume this exact artifact.
  build:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Trusted Publishing (OIDC): no API token. Configure a PyPI Trusted Publisher for this repo with
    # workflow file `release.yml` (and no environment).
    permissions:
      id-token: write  # mints the Trusted-Publishing OIDC token AND signs the attestations
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # PEP 740 attestations: each sdist/wheel is signed with the workflow's Sigstore identity and
      # uploaded alongside it, so PyPI can prove this exact artifact came from this tag in this repo.
      # Only works on Trusted-Publishing flows, and needs no permission beyond `id-token: write`.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  # Build + push the cli and ui image targets. Default registry is GHCR (no extra secret — uses the
  # built-in GITHUB_TOKEN). To use Docker Hub instead: swap `registry`/`username`/`password` for
  # docker.io + secrets.DOCKERHUB_USERNAME/DOCKERHUB_TOKEN, and change the image names below.
  docker:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      matrix:
        target: [cli, ui]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Only after PyPI + Docker both succeed: cut the GitHub release with auto notes and the artifacts.
  github-release:
    needs: [pypi, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
