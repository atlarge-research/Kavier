[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kavier"
version = "0.3.0"
description = "Kavier: Simulating the Performance, Sustainability, and Efficiency of LLM Ecosystems under Inference and Training"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Radu Nicolae", email = "mail@radu-nicolae.com" },
    { name = "AtLarge Research", email = "info@atlarge-research.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pandas>=2.2",
    # pyarrow>=23.0.1 clears GHSA / Apache Arrow use-after-free on IPC pre-buffered
    # reads (dependabot high-sev); was >=16.0.
    "pyarrow>=23.0.1",
    "numpy>=2.2.6",
    "tqdm>=4.67.1",
    "cachetools>=6.1",
    "rich>=13",
]
keywords = [
    "LLM",
    "simulation",
    "performance",
    "sustainability",
    "energy",
    "carbon",
    "GPU",
    "training",
    "inference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/atlarge-research/kavier"
Repository = "https://github.com/atlarge-research/kavier"
Documentation = "https://github.com/atlarge-research/kavier"
"Bug Tracker" = "https://github.com/atlarge-research/kavier/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.102",
    "ruff>=0.4",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-tqdm",
    "types-cachetools",
]

[project.scripts]
kavier        = "kavier_ui:main"
kavier-perf   = "kavier_inference.cli:main"
kavier-train  = "kavier_training.cli:main"
kavier-energy = "kavier_energy.calculator:main"
kavier-co2    = "kavier_co2.cli:main"
# Efficiency entry point (currently runs the energy calculator).
kavier-eff    = "kavier_inference.cli:main_efficiency"

# ------------------------------------------------------------------
#  Tooling
# ------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
include = ["kavier*"]

# Ship only the *small* runtime/demo data: the training calibration table
# (required at import time by kavier_training.core.calibration), the small
# training input example, and the tiny (~562 B) SYNTHETIC inference demo trace
# so the kavier-perf quickstart resolves for pip-installed users too. The
# inference data/output dir (simulation outputs) is never shipped; the original
# large (~74 MB) inference trace is kept out of the package (see examples-local/).
[tool.setuptools.package-data]
# PEP 561: ship the py.typed marker for every first-party package so installed
# consumers get our inline type hints.
kavier = ["py.typed"]
kavier_training = ["py.typed", "data/calibration.json", "data/input/input_example.csv"]
kavier_inference = ["py.typed", "data/input/input_example.csv"]
kavier_io = ["py.typed"]
kavier_energy = ["py.typed"]
kavier_co2 = ["py.typed"]
kavier_library = ["py.typed"]
kavier_opendc = ["py.typed"]

[tool.setuptools.exclude-package-data]
kavier_inference = ["data/output/*", "data/output/**/*"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = [
    "kavier_inference",
    "kavier_training",
    "kavier_library",
    "kavier_io",
    "kavier_opendc",
    "kavier_energy",
]
exclude = ["tests/"]