[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "kavier"
version = "0.5.3"
description = "Kavier: Simulating the Performance, Sustainability, and Efficiency of LLM Ecosystems under Inference and Training"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Radu Nicolae" },
    { name = "Daniele Lotito" },
    { name = "Animesh Trivedi" },
    { name = "Jesse Donkervliet" },
    { name = "Alexandru Iosup" },
]
maintainers = [
    { name = "AtLarge Research", email = "info@atlarge-research.com" },
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pandas>=2.2.3",
    # Floor of 15 lets downstream resolvers meet autogluon's pyarrow<21 cap (coastline -> ado-autoconf).
    # The 23.0.1 GHSA (OOB write when reading Arrow IPC files) does not apply: Kavier reads no IPC files.
    "pyarrow>=15",
    "numpy>=2.2.6",
    "tqdm>=4.67.1",
    "cachetools>=6.1",
    "rich>=13.9",
    "pyyaml>=6.0.2",
]
keywords = [
    "LLM",
    "simulation",
    "performance",
    "sustainability",
    "energy",
    "carbon",
    "GPU",
    "training",
    "inference",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/atlarge-research/kavier"
Repository = "https://github.com/atlarge-research/kavier"
Documentation = "https://atlarge-research.github.io/Kavier/"
"Bug Tracker" = "https://github.com/atlarge-research/kavier/issues"

[project.scripts]
kavier = "kavier.cli:main"

[project.optional-dependencies]
# Used by the calibration refit engine (kavier.sdk.training.calibration.engine); the runtime never imports them.
calibration = [
    "scipy>=1.14",
    "scikit-learn>=1.6",
]

# For kavier.sdk.cluster.plot_timeline and `kavier cluster --plot`; imported lazily.
plot = ["matplotlib>=3.5"]

# PEP 735 groups; `uv sync` installs dev by default. Not part of the published distribution.
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.102",
    "ruff==0.15.15",  # also used by the pre-commit hooks
    "pre-commit>=4.0",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-tqdm",
    "types-cachetools",
    "types-PyYAML",
]
# MkDocs site: uv run --group docs mkdocs serve
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

# ------------------------------------------------------------------
#  Build backend
# ------------------------------------------------------------------

# uv_build ships all of src/kavier/ (calibration JSON, input CSVs, py.typed).
# The excludes keep generated output, snapshots, and .gitignore files out of the artifacts.
[tool.uv.build-backend]
wheel-exclude = ["**/data/output/**", "**/.gitignore", "**/snapshots/**"]
source-exclude = ["**/data/output/**"]

# ------------------------------------------------------------------
#  Tooling
# ------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Applies with `pytest --cov`. Source is the package name, so both the checkout and the venv install are measured.
[tool.coverage.run]
source = ["kavier"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
# numpy >= 2.5 stubs use 3.12-only `type` statements, which mypy rejects in 3.11 mode.
# The 3.11 test leg and ruff's py311 target cover the 3.11 floor.
python_version = "3.12"
strict = true
mypy_path = "src"
# Strict-clean packages; see the mypy steps in .github/workflows/ci.yml.
packages = [
    "kavier.cli",
    "kavier.sdk.co2",
    "kavier.sdk.cluster",
]
exclude = ["tests/"]

# matplotlib comes from the optional [plot] extra and is absent from the default env.
[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true
